name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      # Cache the mongodb-memory-server binary across runs (set to the Linux
      # default download dir used by the package).
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Pre-fetch MongoDB binary (if not cached)
        run: node -e "require('mongodb-memory-server-core').MongoBinary.getPath()"
        continue-on-error: true

      - name: Lint (ESLint + Prettier config)
        run: npm run lint

      - name: Run tests (Vitest — unit + Socket.io integration)
        run: npm test